name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            harness/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e ./harness

      - name: Run unit tests
        run: |
          python -m unittest discover -s harness/tests
          python -m unittest discover -s benchmark/tests

      - name: Compile Python sources
        env:
          PYTHONPYCACHEPREFIX: /tmp/evidence-trail-pycache
        run: python -m compileall -q harness benchmark scripts apps lightrag_custom

  offline-validation:
    name: Offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tracked files for secrets
        run: python scripts/check_tracked_secrets.py

      - name: Check dependency lock integrity
        run: python scripts/check_dependency_locks.py

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            harness/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e ./harness

      - name: Run static checks
        run: |
          python -m ruff check harness/reg_harness benchmark/scripts scripts apps lightrag_custom
          python -m mypy --ignore-missing-imports \
            harness/reg_harness/types.py \
            harness/reg_harness/guards.py \
            harness/reg_harness/llm.py \
            harness/reg_harness/rerank.py \
            harness/reg_harness/runtime.py \
            harness/reg_harness/tools/registry.py \
            harness/reg_harness/tools/lightrag_retrieve.py \
            benchmark/scripts/benchmark_common.py \
            benchmark/scripts/benchmark_contract.py \
            benchmark/scripts/score_answers.py \
            benchmark/scripts/score_kg.py \
            benchmark/scripts/score_retrieval.py \
            scripts/common.py \
            scripts/download_docs.py \
            scripts/ingest.py

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Validate schema guard
        run: python scripts/test_schema_guard.py

      - name: Validate structural corpus
        env:
          AEB_PROFILE_ENV: .env.gb39901_v4
        run: python scripts/test_structural_chunks.py

      - name: Validate benchmark artifacts
        run: python benchmark/scripts/validate_benchmark.py

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            --env-file .env \
            --env-file .env.gb39901_v4 \
            -f compose.yaml \
            -f compose.lightrag-app.yaml \
            config --quiet
